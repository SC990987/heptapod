name: chain-report

# For every pull request, run the analysis chain over the small files in
# tests/fixtures.yaml for both the pull request and the branch it targets, and write a
# comparison to the job summary. The check fails when the pull request introduces NEW
# errors, or when the chain could not be run at all (see tests/README.md); everything
# else is information for the reviewer.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# a new push cancels a report still running for the same pull request
concurrency:
  group: chain-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base commit is needed for the "before" state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the analysis
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then
            pip install -c constraints.txt -r requirements.txt
          else
            pip install -r requirements.txt
          fi
          pip install -e .

      - name: State of this pull request
        run: MPLBACKEND=Agg python tests/chain_report.py compute /tmp/state_new.json

      - name: State of the base branch
        run: |
          # HEAD is the merge commit GitHub builds for pull_request events, so HEAD^1 is
          # exactly the base this pull request was merged into for the step above.
          git rev-parse HEAD^2 >/dev/null 2>&1 || { echo "::error::HEAD is not a merge commit"; exit 1; }
          if git cat-file -e "HEAD^1:analysis_pkg" 2>/dev/null; then
            # Swap only the analysis package back to the base; keep this pull request's
            # test harness and fixtures. Remove first, so that files the pull request
            # adds do not leak into the base side.
            rm -rf analysis_pkg
            git checkout "$(git rev-parse HEAD^1)" -- analysis_pkg
            MPLBACKEND=Agg python tests/chain_report.py compute /tmp/state_base.json
          else
            echo "::notice::the base branch has no analysis_pkg/ yet: nothing to compare with"
            cp /tmp/state_new.json /tmp/state_base.json
          fi

      - name: Compare (fails on new errors, or if the chain did not run)
        run: python tests/chain_report.py render /tmp/state_base.json /tmp/state_new.json >> "$GITHUB_STEP_SUMMARY"
